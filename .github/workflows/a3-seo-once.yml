name: Align AEON search metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a3-seo-once.yml
      - scripts/a3_aeon.py

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply precise software metadata
        run: python scripts/a3_aeon.py
      - name: Remove migration files and commit
        run: |
          rm -f .github/workflows/a3-seo-once.yml scripts/a3_aeon.py
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html robots.txt sitemap.xml .github/workflows/a3-seo-once.yml scripts/a3_aeon.py
          git diff --cached --quiet || git commit -m "Add canonical software search metadata for AEON"
          git push
